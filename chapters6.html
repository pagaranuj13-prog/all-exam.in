<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>चॅप्टर्सची यादी - All Exam</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        
        .main-header { 
            background: linear-gradient(135deg, #007bff, #0056b3); 
            color: white; 
            padding: 25px; 
            border-radius: 12px; 
            text-align: center; 
            margin-bottom: 30px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        .main-header h1 { margin: 0 0 8px 0; font-size: 2rem; }
        .main-header p { margin: 0; font-size: 1.1rem; opacity: 0.9; }

        .section-title { color: #333; margin-top: 25px; border-bottom: 3px solid #007bff; padding-bottom: 6px; font-size: 1.4rem; }
        
        /* आकर्षक आणि मॉडर्न कार्ड्स डिझाईन */
        .chapters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 25px; }
        
        .chapter-card { 
            background: #ffffff; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.06); 
            transition: all 0.3s ease; 
            border-top: 5px solid #007bff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .chapter-card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 12px 25px rgba(0,123,255,0.15); 
        }
        .chapter-card h4 { margin: 0 0 10px 0; color: #222; font-size: 1.2rem; }
        .chapter-card p { margin: 0 0 20px 0; color: #666; font-size: 0.95rem; line-height: 1.4; }
        
        .btn-green { 
            background: linear-gradient(135deg, #28a745, #218838); 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.95rem; 
            font-weight: bold; 
            text-decoration: none; 
            text-align: center;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(40,167,69,0.2);
        }
        .btn-green:hover { background: linear-gradient(135deg, #218838, #1e7e34); }

        .back-btn { 
            background: #6c757d; 
            color: white; 
            padding: 9px 18px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            margin-bottom: 20px; 
            font-size: 0.95rem; 
            font-weight: bold; 
            transition: background 0.2s;
        }
        .back-btn:hover { background: #5a6268; }

        footer { text-align: center; margin-top: 50px; padding: 20px; color: #777; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

    <button class="back-btn" onclick="history.back()">← मागील पानावर जा</button>

    <div class="main-header">
        <h1 id="page-title">चॅप्टर्स अभ्यास मंच</h1>
        <p id="page-subtitle">निवडलेला अभ्यासक्रम आणि विषय</p>
    </div>

    <h2 class="section-title">📖 या विषयातील चॅप्टर्स (Chapters List)</h2>
    
    <div class="chapters-grid" id="chapters-container">
        <!-- चॅप्टर्स इथे डायनॅमिकली लोड होतील -->
    </div>

    <footer><p>&copy; 2026 all-exam.in | सर्व हक्क सुरक्षित.</p></footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const board = urlParams.get('board') || 'CBSE Board';
        const classNum = urlParams.get('class') || '6';
        const subject = urlParams.get('subject') || 'विषय';

        document.getElementById('page-title').innerText = subject;
        document.getElementById('page-subtitle').innerText = board + ' > वर्ग ' + classNum;

        let container = document.getElementById('chapters-container');
        
        // वर्ग ६ चे सर्व विषयांचे अचूक चॅप्टर्स डेटाबेस (इंग्रजीच्या अधिक चॅप्टर्ससह)
        const syllabusData = {
            "Mathematics": [
                { title: "प्रकरण १: Knowing Our Numbers", desc: "संख्यांची ओळख, तुलना आणि स्थानमूल्य." },
                { title: "प्रकरण २: Whole Numbers", desc: "पूर्ण संख्यांचे गुणधर्म आणि संख्या रेषा." },
                { title: "प्रकरण ३: Playing with Numbers", desc: "अवयव, मल्टिपल्स, लसावि आणि मसावि." },
                { title: "प्रकरण ४: Basic Geometrical Ideas", desc: "बिंदू, रेषा, किरण, कोण आणि त्रिकोण." },
                { title: "प्रकरण ५: Understanding Elementary Shapes", desc: "विविध आकार, बाजू आणि कोनांचे मोजमाप." },
                { title: "प्रकरण ६: Integers", desc: "पूर्णांक संख्या आणि त्यांची बेरीज-वजाबाकी." }
            ],
            "Science": [
                { title: "प्रकरण १: The Wonderful World of Science", desc: "विज्ञान आणि आपल्या सभोवतालचे कुतूहल." },
                { title: "प्रकरण २: Diversity in the Living World", desc: "सजीव सृष्टीतील विविधता आणि वनस्पती-प्राण्यांचे वर्गीकरण." },
                { title: "प्रकरण ३: Mindful Eating: A Path to Healthy Body", desc: "अन्नाचे घटक, समतोल आहार आणि आरोग्य." },
                { title: "प्रकरण ४: Exploring Magnets", desc: "चुंबक, त्याचे गुणधर्म आणि उपयोग." },
                { title: "प्रकरण ५: Measurement of Length and Motion", desc: "मोजमापाची मानके आणि गतीचे प्रकार." },
                { title: "प्रकरण ६: Materials Around Us", desc: "पदार्थांचे गुणधर्म आणि त्यांचे वर्गीकरण." }
            ],
            "Social Science": [
                { title: "प्रकरण १: Locating Places on the Earth", desc: "अक्षांश, रेखांश आणि पृथ्वीवरील ठिकाणे शोधणे." },
                { title: "प्रकरण २: Oceans and Continents", desc: "पृथ्वीवरील प्रमुख महासागर आणि सात खंड." },
                { title: "प्रकरण ३: Landforms and Life", desc: "भूप्रदेशाचे प्रकार आणि मानवी जीवन." },
                { title: "प्रकरण ४: What, Where, How and When?", desc: "इतिहास म्हणजे काय? भूतकाळ कसा शोधायचा?" },
                { title: "प्रकरण ५: From Hunting-Gathering to Growing Food", desc: "आदिमानवाचा शिकारीपासून शेतकरी होण्यापर्यंतचा प्रवास." }
            ],
            "English": [
                { title: "Chapter 1: Who Did Patrick's Homework?", desc: "An interesting story about a boy and an elf who helps him with homework." },
                { title: "Chapter 2: How the Dog Found Himself a New Master!", desc: "A fascinating tale of how dogs became domestic animals and chose their master." },
                { title: "Chapter 3: Taro's Reward", desc: "A heartwarming story of a dutiful son who cared for his parents." },
                { title: "Chapter 4: An Indian-American Woman in Space", desc: "The inspiring life journey and achievements of Kalpana Chawla." },
                { title: "Chapter 5: A Different Kind of School", desc: "Learning empathy, sympathy, and compassion through unique school experiences." },
                { title: "Chapter 6: Who I Am", desc: "Exploring the unique qualities, dreams, and diversity of different individuals." },
                { title: "Chapter 7: Fair Play", desc: "A moral story about friendship, justice, and truth (Jumman and Algu)." }
            ],
            "Hindi": [
                { title: "पाठ १: वह चिड़िया जो", desc: "केदारनाथ अग्रवाल जी की सुंदर कविता।" },
                { title: "पाठ २: बचपन", desc: "कृष्णा सोबती जी का संस्मरण - लेखिका का बचपन।" },
                { title: "पाठ ३: नादान दोस्त", desc: "प्रेमचंद जी की कहानी - नादानी में चिड़िया के अंडों की देखभाल।" },
                { title: "पाठ ४: चाँद से थोड़ी सी गप्पें", desc: "एक छोटी बच्ची की चाँद के साथ प्यारी बातचीत।" },
                { title: "पाठ ५: अक्षर की कहानी", desc: "अक्षरों की खोज और विकास का इतिहास।" }
            ],
            "Information Technology": [
                { title: "Chapter 1: Computer Fundamentals", desc: "Introduction to Computer Hardware, Software, and basic operations." },
                { title: "Chapter 2: Operating System Basics", desc: "Managing files, folders, and windows desktop settings effectively." },
                { title: "Chapter 3: MS Word Basics", desc: "Creating documents, formatting text, inserting images, and editing." }
            ],
            "Sanskrit": [
                { title: "पाठः १: शब्दपरिचयः प्रथमः", desc: "अकारान्त-पुंलिंगशब्दानां परिचयः।" },
                { title: "पाठः २: शब्दपरिचयः द्वितीयः", desc: "आकारान्त-स्त्रीलिंगशब्दानां परिचयः।" },
                { title: "पाठः ३: शब्दपरिचयः तृतीयः", desc: "नपुंसकलिंगशब्दानां परिचयः।" }
            ]
        };

        let chaptersList = syllabusData[subject] || [
            { title: "प्रकरण १: मूलभूत संकल्पना", desc: "या विषयातील प्राथमिक आणि महत्त्वाची माहिती." },
            { title: "प्रकरण २: सराव व अभ्यास", desc: "परीक्षाभिमुख महत्त्वाचे प्रश्न व उत्तरे." }
        ];

        chaptersList.forEach((chap, index) => {
            container.innerHTML += `
                <div class="chapter-card">
                    <div>
                        <h4>${chap.title}</h4>
                        <p>${chap.desc}</p>
                    </div>
                    <a href="quiz.html?board=${encodeURIComponent(board)}&class=${classNum}&subject=${encodeURIComponent(subject)}&chapter=${index + 1}" class="btn-green">सराव सुरू करा</a>
                </div>
            `;
        });
    </script>
</body>
</html>
