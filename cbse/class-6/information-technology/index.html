<!DOCTYPE html>
<html lang="mr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBSE varg 6 - Computer & IT | all-exam.in</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#f4f5fa;color:#222;font-family:Arial,"Noto Sans Devanagari",sans-serif}
.wrap{max-width:1100px;margin:0 auto}
.back{display:inline-block;background:#6c757d;color:#fff;padding:10px 16px;border-radius:6px;font-weight:bold;font-size:15px;text-decoration:none}
h1{font-size:24px;margin:32px 0 20px;padding-bottom:10px;border-bottom:2px solid #007bff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:18px;text-align:center}
.card b{display:block;font-size:13px;color:#444;margin-bottom:6px}
.card span{display:block;font-size:16px;font-weight:bold;margin-bottom:12px}
.btn{background:var(--bt);color:#fff;border:0;padding:8px 18px;border-radius:6px;font:bold 15px Arial,"Noto Sans Devanagari",sans-serif;text-decoration:underline;cursor:pointer}
.note{margin:10px 0 0;font-size:13px;color:#b35c00}
.empty{color:#666}
footer{margin-top:40px;padding-top:20px;border-top:1px solid #ddd;text-align:center;color:#777}
</style></head><body><div class="wrap">
<a class="back" href="../">&larr; Vishayanvar ja</a>
<h1>CBSE Board &gt; varg 6 &gt; Computer &amp; IT - Topics</h1>
<div id="grid" class="grid"></div>
<footer>&copy; 2026 all-exam.in | Sarv hakk surakshit.</footer>
</div>
<script>
// Computer vishayache topics
const TOPICS = [
 "Software and Computer Languages",
 "Algorithms and Flowcharts",
 "Formulae and Functions",
 "More on PowerPoint",
 "Introduction to QBASIC",
 "Statements in QBASIC",
 "Introduction to Adobe Animate CC",
 "More on Adobe Animate CC",
 "Internet Addressing Schemes",
 "Projects",
 "Olympiad Practice Sheet",
 "Office 365 Features"
];

// Pariksha suru karnyasathi nantar yethe code joda
function startQuiz(i, note){ note.textContent = "Ya chapterchi pariksha lavkarach yet ahe."; }

// Cardsche rang: [parshvabhumi, kinar, butan]
const COLORS = [
 ["#fdecec","#e57373","#c62828"],
 ["#e8f5e9","#66bb6a","#2e7d32"],
 ["#fff8e1","#ffca28","#a86400"],
 ["#fce4ec","#f06292","#ad1457"],
 ["#f3e5f5","#ab47bc","#7b1fa2"],
 ["#e3f2fd","#42a5f5","#1565c0"],
 ["#fff3e0","#ffa726","#d84315"],
 ["#e0f7fa","#26c6da","#00796b"]
];
const grid = document.getElementById("grid");
if (!TOPICS.length) {
  grid.innerHTML = '<p class="empty">Topicschi yadi lavkarach jodali jail.</p>';
}
TOPICS.forEach((t, i) => {
  const c = document.createElement("div"); c.className = "card";
  const col = COLORS[i % COLORS.length];
  c.style.setProperty("--bg", col[0]); c.style.setProperty("--bd", col[1]); c.style.setProperty("--bt", col[2]);
  const b = document.createElement("b"); b.textContent = (i < 9) ? "Chapter " + (i + 1) : "Section " + (i + 1);
  const s = document.createElement("span"); s.textContent = t;
  const btn = document.createElement("a"); btn.className = "btn"; btn.textContent = "परीक्षा द्या";
btn.href = "quiz.html?chapter=" + (i + 1);
  const n = document.createElement("p"); n.className = "note";
  btn.onclick = () => startQuiz(i, n);
  c.append(b, s, btn, n); grid.appendChild(c);
});
</script></body></html>
