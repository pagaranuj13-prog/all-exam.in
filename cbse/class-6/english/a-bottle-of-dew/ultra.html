<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Quiz | all-exam.in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', 'Hind', sans-serif;
      color: #ffffff;
      color-scheme: dark;
      min-height: 100vh;
      background: #000000;
      overflow-x: hidden;
    }
    .marathi-text { font-family: 'Hind', sans-serif; letter-spacing: .1px; }
    .custom-shadow { box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 20px 50px -15px rgba(251,191,36,.18); }
    .timer-warn { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .6; } }
  </style>
</head>
<body class="text-white flex flex-col justify-between min-h-screen p-3 md:p-5">

  <!-- Header Section -->
  <header class="max-w-2xl w-full mx-auto mb-3 text-center">
    <h1 id="pageTitle" class="text-xl md:text-2xl font-extrabold text-white tracking-tight">
      Dhada Test <span class="text-amber-400 font-bold text-base md:text-lg block md:inline marathi-text">(टेस्ट सुरू आहे)</span>
    </h1>
  </header>

  <!-- Main Quiz Container -->
  <main class="max-w-xl w-full mx-auto bg-neutral-950 rounded-2xl p-4 md:p-6 custom-shadow border border-neutral-800 relative">

    <!-- Top Action Toolbar -->
    <div class="flex justify-between items-center mb-4 border-b border-neutral-800 pb-2.5 gap-2">
      <span class="text-[11px] font-bold text-emerald-300 bg-emerald-950 px-2.5 py-1 rounded-full border border-emerald-700">
        <i class="fa-solid fa-language text-emerald-400"></i> English + मराठी अर्थ
      </span>

      <!-- TIMER -->
      <span class="text-[12px] font-extrabold text-indigo-200 bg-indigo-950 px-2.5 py-1 rounded-full border border-indigo-700 flex items-center gap-1">
        <i class="fa-solid fa-stopwatch text-indigo-300"></i>
        <span id="timerDisplay">00:00</span>
      </span>

      <a id="backBtn" href="quiz.html" class="text-[11px] font-semibold bg-neutral-800 hover:bg-neutral-700 text-white px-2.5 py-1 rounded-lg transition">
        <i class="fa-solid fa-arrow-left"></i> मागे जा
      </a>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quizScreen">
      <!-- Progress Bar & Score Counter -->
      <div class="mb-3">
        <div class="flex justify-between text-xs font-bold text-neutral-300 mb-1">
          <span id="questionCounter">Question 1/100</span>
          <span id="scoreTracker" class="text-emerald-400 font-bold text-xs">Score: 0</span>
        </div>
        <div class="w-full bg-neutral-800 rounded-full h-2 overflow-hidden border border-neutral-700">
          <div id="progressBar" class="bg-gradient-to-r from-amber-500 to-emerald-500 h-full rounded-full transition-all duration-300" style="width: 1%"></div>
        </div>
      </div>

      <!-- Question Box -->
      <div class="mb-4 bg-neutral-900 p-4 rounded-xl border border-neutral-700">
        <h3 id="questionTextEng" class="text-base md:text-lg font-bold text-white leading-snug"></h3>
        <p id="questionTextMar" class="text-sm md:text-base font-semibold text-emerald-300 marathi-text mt-1.5"></p>
      </div>

      <!-- Options Container -->
      <div id="optionsContainer" class="space-y-2.5 mb-4"></div>

      <!-- Instant Feedback Box -->
      <div id="feedbackBox" class="hidden p-3 rounded-xl mb-4 text-sm border">
        <div class="flex items-start gap-2">
          <div id="feedbackIcon" class="text-lg mt-0.5"></div>
          <div>
            <h4 id="feedbackTitle" class="font-bold text-xs mb-0.5"></h4>
            <p id="feedbackTextEng" class="text-white font-medium leading-normal"></p>
            <p id="feedbackTextMar" class="text-neutral-200 font-semibold marathi-text mt-1 pt-1 border-t border-neutral-700"></p>
          </div>
        </div>
      </div>

      <!-- Skip Button -->
      <button id="skipBtn" onclick="skipQuestion()" class="w-full py-2.5 mb-2 bg-amber-400/10 hover:bg-amber-400/20 text-amber-300 border-2 border-amber-500/60 font-bold text-xs md:text-sm rounded-xl transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-forward"></i> <span>प्रश्न वगळा (Skip Question)</span>
      </button>

      <!-- Next Button (Initially Hidden) -->
      <button id="nextBtn" onclick="nextQuestion()" class="hidden w-full py-2.5 bg-white hover:bg-neutral-200 text-black font-bold text-xs md:text-sm rounded-xl shadow transition flex items-center justify-center gap-1.5">
        <span>पुढचा प्रश्न (Next Question)</span> <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="resultScreen" class="hidden text-center py-2">
      <div class="w-12 h-12 bg-amber-400/15 text-amber-400 rounded-xl flex items-center justify-center mx-auto mb-2 text-xl">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h2 class="text-lg md:text-xl font-extrabold text-white">Quiz Completed!</h2>
      <p class="text-emerald-300 font-bold marathi-text text-sm mb-3">अभिनंदन! टेस्ट पूर्ण झाली!</p>

      <div class="bg-gradient-to-br from-amber-950/60 to-emerald-950/60 rounded-xl p-3 border border-amber-700/60 mb-4 max-w-sm mx-auto">
        <div class="grid grid-cols-3 divide-x divide-neutral-700">
          <div class="p-1">
            <span class="block text-[10px] font-bold text-neutral-300 uppercase">Total Score</span>
            <span id="finalScore" class="text-xl font-extrabold text-emerald-400">0/0</span>
          </div>
          <div class="p-1">
            <span class="block text-[10px] font-bold text-neutral-300 uppercase">Percentage</span>
            <span id="finalPercentage" class="text-xl font-extrabold text-white">0%</span>
          </div>
          <div class="p-1">
            <span class="block text-[10px] font-bold text-neutral-300 uppercase">Time Taken</span>
            <span id="finalTime" class="text-xl font-extrabold text-indigo-300">00:00</span>
          </div>
        </div>
        <p class="mt-2 text-xs font-bold text-neutral-200">वगळलेले प्रश्न (Skipped): <span id="finalSkipped">0</span></p>
        <p id="performanceMessage" class="mt-2 text-xs font-bold text-amber-200 bg-amber-400/15 py-1 px-2 rounded-lg inline-block marathi-text"></p>
      </div>

      <div class="flex justify-center">
        <a id="resultBackBtn" href="quiz.html" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition text-xs flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-right"></i> पुन्हा प्रयत्न करा / मागे जा
        </a>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="mt-4 text-center text-[11px] text-neutral-400">
    <p>&copy; 2026 all-exam.in | सर्व हक्क सुरक्षित.</p>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const chapter = '1';
    const level = 'Ultra-level';

    document.getElementById('pageTitle').innerHTML = `धडा ${chapter} - टेस्ट (${level}) <span class="text-amber-400 font-bold text-xs md:text-sm block md:inline marathi-text">(${level} Level)</span>`;
    document.getElementById('backBtn').href = `quiz.html?chapter=${chapter}`;
    document.getElementById('resultBackBtn').href = `quiz.html?chapter=${chapter}`;

    // ============================================================
    // ALL 100 QUESTIONS — "A Bottle of Dew" (Class 6, Sudha Murty)
    // ============================================================
    const activeQuestions = [
      {
        questionEng: "Who wrote the story 'A Bottle of Dew'?",
        questionMar: "'अ बॉटल ऑफ ड्यू' ही कथा कोणी लिहिली?",

          { eng: "Ruskin Bond", mar: "रस्किन बॉंड" },
          { eng: "Sudha Murty", mar: "सुधा मूर्ती" },
          { eng: "R.K. Narayan", mar: "आर. के. नारायण" },
          { eng: "Mahipati", mar: "महिपती" }
        ],

      {
        questionEng: "Who is the main character of the story?",

        options: [
          { eng: "Rama Natha", mar: "रामा नाथ" },
          { eng: "Mahipati", mar: "महिपती" },
          { eng: "Madhumati", mar: "मधुमती" },
          { eng: "Sudha", mar: "सुधा" }
        ],
        correct: 0,
        explanationEng: "Rama Natha is the protagonist of the story.",
        explanationMar: "रामा नाथ हा कथेचा नायक आहे."
      },
      {

          { eng: "Sudha", mar: "सुधा" },
          { eng: "Madhumati", mar: "मधुमती" },
          { eng: "Mahipati", mar: "महिपती" },
          { eng: "Saraswati", mar: "सरस्वती" }
        ],
        correct: 1,
        explanationEng: "Rama Natha's wife is Madhumati.",
        explanationMar: "रामा नाथाची पत्नी मधुमती आहे."

      {

      {

      {

          { eng: "The weather", mar: "हवामान" },
          { eng: "Money", mar: "पैसे" }
        ],
        correct: 1,
        explanationEng: "He asked the sage about the magic potion.",
        explanationMar: "त्याने ऋषींना जादुई औषधाबद्दल विचारले."
      },
      {
        questionEng: "Did the sage say there was a way to make the magic potion?",
        questionMar: "ऋषींनी सांगितले की जादुई औषध बनवण्याचा मार्ग आहे का?",
        options: [
          { eng: "Yes, through a task", mar: "होय, एका कार्याद्वारे" },

          { eng: "Rose plants", mar: "गुलाबाची रोपे" }

    function formatTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const mm = String(m).padStart(2, '0');
      const ss = String(s).padStart(2, '0');
      return h > 0 ? `${String(h).padStart(2, '0')}:${mm}:${ss}` : `${mm}:${ss}`;
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        totalSeconds = Math.floor((Date.now() - startTime) / 1000);
        timerDisplay.textContent = formatTime(totalSeconds);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      totalSeconds = Math.floor((Date.now() - startTime) / 1000);
      timerDisplay.textContent = formatTime(totalSeconds);

      if (isCorrect) {
        feedbackBox.className = "p-3 rounded-xl mb-4 text-sm border bg-emerald-950 border-emerald-600";
        feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i>`;
        feedbackTitle.textContent = "बरोबर उत्तर! (Correct Answer)";
        feedbackTitle.className = "font-bold text-emerald-300 text-sm mb-0.5";
      } else {
        feedbackBox.className = "p-3 rounded-xl mb-4 text-sm border bg-rose-950 border-rose-600";
        feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-400"></i>`;
        feedbackTitle.textContent = "चुकीचे उत्तर! (Incorrect Answer)";
        feedbackTitle.className = "font-bold text-rose-300 text-sm mb-0.5";
      }

      feedbackTextEng.textContent = q.explanationEng;
      feedbackTextMar.textContent = "स्पष्टीकरण: " + q.explanationMar;

      nextBtn.style.display = 'flex';
      nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function skipQuestion() {
      if (isAnswered) return;
      skipped++;
      nextQuestion();
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < activeQuestions.length) {
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showResults();
      }
    }

    function showResults() {
      stopTimer();
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');

      const percentage = Math.round((score / activeQuestions.length) * 100);
      document.getElementById('finalScore').textContent = `${score}/${activeQuestions.length}`;
      document.getElementById('finalPercentage').textContent = `${percentage}%`;
      document.getElementById('finalTime').textContent = formatTime(totalSeconds);
      document.getElementById('finalSkipped').textContent = skipped;

      const perfMsg = document.getElementById('performanceMessage');
      if (percentage === 100) {
        perfMsg.textContent = "उत्तुंग यश! तुम्ही सर्व प्रश्नांची उत्तरे बरोबर दिली आहेत.";
      } else if (percentage >= 50) {
        perfMsg.textContent = "छान प्रयत्न! तुमचा अभ्यास चांगला आहे.";
      } else {
        perfMsg.textContent = "पुन्हा एकदा धडा वाचा आणि सराव करा!";
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
