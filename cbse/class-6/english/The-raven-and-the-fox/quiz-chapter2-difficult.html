<body class="flex flex-col justify-between min-h-screen p-3 md:p-5">

document.getElementById('resultBackBtn').href = `quiz.html?chapter=${chapter}`;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const split = t => { const i = t.lastIndexOf(' / '); return i < 0 ? [t.trim(), ''] : [t.slice(0, i).trim(), t.slice(i + 3).trim()]; };
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);

function parseBank(raw, lvl) {
  const block = raw.split(/LEVEL:\s*/i).slice(1).find(s => s.trim().toLowerCase().startsWith(lvl));
  if (!block) return [];
  const re = /^\s*\d+\.\s+(?:Q:\s*)?(.+)\n\s*(\[A\].*?)\s*✓([A-D])\s*\n\s*E:\s*(.+)$/gm;
  const out = []; let m;
  while ((m = re.exec(block))) {
    const [qe, qm] = split(m[1]);
    const [ee, em] = split(m[4]);
    let opts = m[2].split(/\[[A-D]\]\s*/).slice(1).map(s => s.trim());
    let correct = m[3].charCodeAt(0) - 65;
    const isTF = opts.length === 2 && opts[0] === 'True';
    if (!isTF) { // answers are all "A" in the source, so shuffle
      const ans = opts[correct]; opts = shuffle(opts); correct = opts.indexOf(ans);
    }
    out.push({ questionEng: qe, questionMar: qm, options: opts.map(t => ({ eng: t, mar: TF_MAR[t] || '' })), correct, explanationEng: ee, explanationMar: em });
  }
  return out;
}

const activeQuestions = parseBank(document.getElementById('bank').textContent, level);
if (!activeQuestions.length) {
  document.getElementById('quizScreen').innerHTML = '<p class="text-center text-amber-300 marathi-text py-6">या लेव्हलसाठी प्रश्न उपलब्ध नाहीत.</p>';
}

let cur = 0, isAnswered = false;
const userAnswers = new Array(activeQuestions.length).fill(null); // null=unvisited, -1=skipped
const $ = id => document.getElementById(id);
const getScore = () => userAnswers.reduce((s, a, i) => s + (a !== null && a !== -1 && a === activeQuestions[i].correct ? 1 : 0), 0);
const getSkipped = () => userAnswers.filter(a => a === -1).length;

/* timer */
const startTime = Date.now(); let timerInterval, totalSeconds = 0;
const fmt = s => { const h = Math.floor(s / 3600), m = String(Math.floor(s % 3600 / 60)).padStart(2, '0'), ss = String(s % 60).padStart(2, '0'); return h ? `${String(h).padStart(2, '0')}:${m}:${ss}` : `${m}:${ss}`; };
const tick = () => { totalSeconds = Math.floor((Date.now() - startTime) / 1000); $('timerDisplay').textContent = fmt(totalSeconds); };
const OK = "w-full text-left p-2.5 md:p-3 rounded-xl border-2 border-emerald-400 bg-emerald-950 font-bold flex items-center justify-between";
const BAD = "w-full text-left p-2.5 md:p-3 rounded-xl border-2 border-rose-400 bg-rose-950 font-bold flex items-center justify-between";

function showFeedback(ok, q) {
  const fb = $('feedbackBox');
  fb.className = "p-3 rounded-xl mb-4 text-sm border " + (ok ? "bg-emerald-950 border-emerald-600" : "bg-rose-950 border-rose-600");
  $('feedbackIcon').innerHTML = ok ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' : '<i class="fa-solid fa-circle-xmark text-rose-400"></i>';
  $('feedbackTitle').textContent = ok ? "बरोबर उत्तर! (Correct Answer)" : "चुकीचे उत्तर! (Incorrect Answer)";
  $('feedbackTitle').className = "font-bold text-sm mb-0.5 " + (ok ? "text-emerald-300" : "text-rose-300");
  $('feedbackEng').textContent = q.explanationEng;
  $('feedbackMar').textContent = "स्पष्टीकरण: " + q.explanationMar;
}

function renderQuestion() {
  if (!activeQuestions.length) return;
  const q = activeQuestions[cur], prev = userAnswers[cur];
  isAnswered = prev !== null && prev !== -1;
  $('feedbackBox').classList.add('hidden');
  $('nextBtn').style.display = isAnswered ? 'flex' : 'none';
  $('skipBtn').style.display = isAnswered ? 'none' : 'flex';
  $('questionCounter').textContent = `Question ${cur + 1}/${activeQuestions.length}`;
  $('scoreTracker').textContent = `Score: ${getScore()}`;
  $('progressBar').style.width = `${(cur + 1) / activeQuestions.length * 100}%`;
  $('qEng').textContent = q.questionEng;
  $('qMar').textContent = q.questionMar;
  const box = $('optionsContainer'); box.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const b = document.createElement('button');
    b.className = "w-full text-left p-2.5 md:p-3 rounded-xl border-2 border-neutral-700 hover:border-emerald-400 hover:bg-emerald-400/10 transition flex items-center justify-between group bg-neutral-900";
    b.innerHTML = `<div class="flex items-start gap-2.5"><span class="w-6 h-6 rounded-lg bg-neutral-800 group-hover:bg-emerald-400 group-hover:text-black flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">${String.fromCharCode(65 + idx)}</span><div><p class="text-sm md:text-base font-semibold">${esc(opt.eng)}</p>${opt.mar ? `<p class="text-xs md:text-sm font-medium text-emerald-300 marathi-text mt-0.5">${esc(opt.mar)}</p>` : ''}</div></div>`;
    if (isAnswered) {
      b.disabled = true;
      if (idx === q.correct) b.className = OK; else if (idx === prev) b.className = BAD; else b.classList.add('opacity-50');
    } else b.onclick = () => selectOption(idx);
    box.appendChild(b);
  });
  if (isAnswered) showFeedback(prev === q.correct, q);
}

function selectOption(i) {
  if (isAnswered) return;
  isAnswered = true; userAnswers[cur] = i;
  const q = activeQuestions[cur], ok = i === q.correct;
  $('scoreTracker').textContent = `Score: ${getScore()}`;
  Array.from($('optionsContainer').children).forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.correct) b.className = OK; else if (idx === i) b.className = BAD; else b.classList.add('opacity-50');
  });
  showFeedback(ok, q);
  $('skipBtn').style.display = 'none';
  $('nextBtn').style.display = 'flex';
  $('nextBtn').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function skipQuestion() { if (isAnswered) return; userAnswers[cur] = -1; nextQuestion(); }
function nextQuestion() {
  if (cur < activeQuestions.length - 1) { cur++; renderQuestion(); scrollTo({ top: 0, behavior: 'smooth' }); }
  else showResults();
}
function goBack() {
  if (cur > 0) { cur--; renderQuestion(); scrollTo({ top: 0, behavior: 'smooth' }); }
  else location.href = `quiz.html?chapter=${chapter}`;
}
function showResults() {
  clearInterval(timerInterval); tick();
  $('quizScreen').classList.add('hidden'); $('resultScreen').classList.remove('hidden');
  const s = getScore(), n = activeQuestions.length, pct = Math.round(s / n * 100);
  $('finalScore').textContent = `${s}/${n}`; $('finalPercentage').textContent = `${pct}%`;
  $('finalTime').textContent = fmt(totalSeconds); $('finalSkipped').textContent = getSkipped();
  $('performanceMessage').textContent = pct === 100 ? "उत्तुंग यश! तुम्ही सर्व प्रश्नांची उत्तरे बरोबर दिली आहेत." : pct >= 50 ? "छान प्रयत्न! तुमचा अभ्यास चांगला आहे." : "पुन्हा एकदा धडा वाचा आणि सराव करा!";
  scrollTo({ top: 0, behavior: 'smooth' });
}

timerInterval = setInterval(tick, 1000);
renderQuestion();
</script>
</body>
</html>
