<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Quiz | all-exam.in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Mukta', sans-serif;
      min-height: 100vh;
      background: #ffffff;
      overflow-x: hidden;
    }
    .marathi-text { font-family: 'Mukta', sans-serif; }
    .custom-shadow { box-shadow: 0 10px 30px -8px rgba(15, 23, 42, 0.15); }
    .timer-warn { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .6; } }
  </style>
</head>
<body class="text-slate-800 flex flex-col justify-between min-h-screen p-3 md:p-5">

  <!-- Header Section -->
  <header class="max-w-2xl w-full mx-auto mb-3 text-center">
    <h1 id="pageTitle" class="text-xl md:text-2xl font-extrabold text-slate-900 tracking-tight">
      Dhada Test <span class="text-amber-600 font-bold text-base md:text-lg block md:inline marathi-text">(टेस्ट सुरू आहे)</span>
    </h1>
  </header>

  <!-- Main Quiz Container -->
  <main class="max-w-xl w-full mx-auto bg-white rounded-2xl p-4 md:p-6 custom-shadow border border-slate-200 relative">

    <!-- Top Action Toolbar -->
    <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-2.5 gap-2">
      <span class="text-[11px] font-bold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
        <i class="fa-solid fa-language text-emerald-600"></i> English + मराठी अर्थ
      </span>

      <!-- TIMER -->
      <span class="text-[12px] font-extrabold text-indigo-800 bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-200 flex items-center gap-1">
        <i class="fa-solid fa-stopwatch text-indigo-600"></i>
        <span id="timerDisplay">00:00</span>
      </span>

      <a id="backBtn" href="quiz.html" class="text-[11px] font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg transition">
        <i class="fa-solid fa-arrow-left"></i> मागे जा
      </a>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quizScreen">
      <!-- Progress Bar & Score Counter -->
      <div class="mb-3">
        <div class="flex justify-between text-xs font-bold text-slate-500 mb-1">
          <span id="questionCounter">Question 1/2</span>
          <span id="scoreTracker" class="text-emerald-700 font-bold text-xs">Score: 0</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden border border-slate-200">
          <div id="progressBar" class="bg-gradient-to-r from-amber-500 to-emerald-500 h-full rounded-full transition-all duration-300" style="width: 50%"></div>
        </div>
      </div>

      <!-- Question Box -->
      <div class="mb-4 bg-slate-50/80 p-3.5 rounded-xl border border-slate-200">
        <h3 id="questionTextEng" class="text-sm md:text-base font-bold text-slate-900 leading-snug"></h3>
        <p id="questionTextMar" class="text-xs md:text-sm font-semibold text-emerald-800 marathi-text mt-1"></p>
      </div>

      <!-- Options Container -->
      <div id="optionsContainer" class="space-y-2.5 mb-4"></div>

      <!-- Instant Feedback Box -->
      <div id="feedbackBox" class="hidden p-3 rounded-xl mb-4 text-xs border">
        <div class="flex items-start gap-2">
          <div id="feedbackIcon" class="text-lg mt-0.5"></div>
          <div>
            <h4 id="feedbackTitle" class="font-bold text-xs mb-0.5"></h4>
            <p id="feedbackTextEng" class="text-slate-800 font-medium leading-normal"></p>
            <p id="feedbackTextMar" class="text-slate-700 font-semibold marathi-text mt-0.5 pt-0.5 border-t border-slate-200"></p>
          </div>
        </div>
      </div>

      <!-- Skip Button -->
      <button id="skipBtn" onclick="skipQuestion()" class="w-full py-2.5 mb-2 bg-amber-50 hover:bg-amber-100 text-amber-800 border-2 border-amber-300 font-bold text-xs md:text-sm rounded-xl transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-forward"></i> <span>प्रश्न वगळा (Skip Question)</span>
      </button>

      <!-- Next Button (Initially Hidden) -->
      <button id="nextBtn" onclick="nextQuestion()" class="hidden w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs md:text-sm rounded-xl shadow transition flex items-center justify-center gap-1.5">
        <span>पुढचा प्रश्न (Next Question)</span> <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="resultScreen" class="hidden text-center py-2">
      <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center mx-auto mb-2 text-xl">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h2 class="text-lg md:text-xl font-extrabold text-slate-900">Quiz Completed!</h2>
      <p class="text-emerald-800 font-bold marathi-text text-sm mb-3">अभिनंदन! टेस्ट पूर्ण झाली!</p>

      <div class="bg-gradient-to-br from-amber-50 to-emerald-50 rounded-xl p-3 border border-amber-200 mb-4 max-w-sm mx-auto">
        <div class="grid grid-cols-3 divide-x divide-slate-200">
          <div class="p-1">
            <span class="block text-[10px] font-bold text-slate-500 uppercase">Total Score</span>
            <span id="finalScore" class="text-xl font-extrabold text-emerald-600">0/0</span>
          </div>
          <div class="p-1">
            <span class="block text-[10px] font-bold text-slate-500 uppercase">Percentage</span>
            <span id="finalPercentage" class="text-xl font-extrabold text-slate-800">0%</span>
          </div>
          <div class="p-1">
            <span class="block text-[10px] font-bold text-slate-500 uppercase">Time Taken</span>
            <span id="finalTime" class="text-xl font-extrabold text-indigo-600">00:00</span>
          </div>
        </div>
        <p class="mt-2 text-[11px] font-bold text-slate-600">वगळलेले प्रश्न (Skipped): <span id="finalSkipped">0</span></p>
        <p id="performanceMessage" class="mt-2 text-xs font-bold text-amber-900 bg-amber-100 py-1 px-2 rounded-lg inline-block marathi-text"></p>
      </div>

      <div class="flex justify-center">
        <a id="resultBackBtn" href="quiz.html" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition text-xs flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-right"></i> पुन्हा प्रयत्न करा / मागे जा
        </a>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="mt-4 text-center text-[11px] text-slate-500">
    <p>&copy; 2026 all-exam.in | सर्व हक्क सुरक्षित.</p>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const chapter = '1';
    const level = 'Easy';

    document.getElementById('pageTitle').innerHTML = `धडा ${chapter} - टेस्ट (${level}) <span class="text-amber-600 font-bold text-xs md:text-sm block md:inline marathi-text">(${level} Level)</span>`;
    document.getElementById('backBtn').href = `quiz.html?chapter=${chapter}`;
    document.getElementById('resultBackBtn').href = `quiz.html?chapter=${chapter}`;

const sh = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
const P = s => s.split(';').map(x => x.split('|'));
const Q = (q, qm, ans, pool, ex, exm) => {
  const o = sh([ans, ...sh(pool.filter(x => x !== ans)).slice(0, 3)]);
  return { questionEng: q, questionMar: qm, options: o.map(t => ({ eng: t, mar: '' })), correct: o.indexOf(ans), explanationEng: ex, explanationMar: exm };
};

  ["Who is the main character of the story?","कथेतील मुख्य पात्र कोण आहे?",["Mahipati","Rama Natha","Madhumati","Raman"],1,"Rama Natha is the main character."],

function buildPaper(L) {
  const d = BANK[L], out = [];
  d.c.forEach(c => out.push({ questionEng: "[Chapter] " + c[0], questionMar: c[1], options: c[2].map(t => ({ eng: t, mar: '' })), correct: c[3], explanationEng: c[4], explanationMar: "योग्य उत्तर: " + c[2][c[3]] }));
  (d.tf || '').split(';').filter(Boolean).forEach(x => { const [s, t, fix] = x.split('~'); out.push({ questionEng: '[Chapter] True or False: ' + s, questionMar: 'हे विधान बरोबर आहे की चूक?', options: [{ eng: 'True', mar: 'बरोबर' }, { eng: 'False', mar: 'चूक' }], correct: t === 'T' ? 0 : 1, explanationEng: t === 'T' ? 'This statement is true.' : 'False. ' + fix + '.', explanationMar: t === 'T' ? 'हे विधान बरोबर आहे.' : 'हे विधान चूक आहे.' }); });
  const syn = P(d.syn), ant = P(d.ant), one = P(d.one), mean = P(d.mean);
  syn.forEach(([w, a]) => out.push(Q(`[Synonym] Choose the word with the same meaning as "${w}".`, `"${w}" चा समानार्थी शब्द निवडा.`, a, syn.map(x => x[1]), `"${w}" = "${a}".`, `"${w}" म्हणजे "${a}" (समानार्थी).`)));
  ant.forEach(([w, a]) => out.push(Q(`[Antonym] Choose the opposite of "${w}".`, `"${w}" चा विरुद्धार्थी शब्द निवडा.`, a, ant.map(x => x[1]), `Opposite of "${w}" is "${a}".`, `"${w}" चा विरुद्धार्थी "${a}" आहे.`)));
  one.forEach(([p, w]) => out.push(Q(`[One Word] ${p} is called ___.`, `एका शब्दात सांगा.`, w, one.map(x => x[1]), `"${w}" = ${p}.`, `योग्य शब्द: "${w}".`)));
  mean.forEach(([w, m]) => out.push(Q(`[Word Meaning] What is the meaning of "${w}"?`, `"${w}" चा अर्थ काय?`, m, mean.map(x => x[1]), `"${w}" means ${m}.`, `"${w}" = ${m}.`)));
  [['art', 'Article'], ['ten', 'Tense'], ['vrb', 'Verb'], ['adv', 'Adverb']].forEach(([k, tag]) =>
    P(d[k]).forEach(([s, a, ...w]) => {
      const o = sh([a, ...w]);
      out.push({ questionEng: `[${tag}] Fill in the blank: ${s}`, questionMar: 'रिकाम्या जागी योग्य पर्याय निवडा.', options: o.map(t => ({ eng: t, mar: '' })), correct: o.indexOf(a), explanationEng: `Correct sentence: ${s.replace('___', a)}`, explanationMar: `योग्य पर्याय: ${a}` });
    }));
  return out;
}

const LV = /^e/i.test(level) ? 'Easy' : /^m/i.test(level) ? 'Medium' : 'Difficult';

    const defaultQuestions = [
      {
        questionEng: "Sample Question 1 for Chapter " + chapter + " (" + level + ")?",
        questionMar: "धडा " + chapter + " (" + level + ") साठीचा सराव प्रश्न १?",
        options: [
          { eng: "Option A", mar: "पर्याय अ" },
          { eng: "Option B", mar: "पर्याय ब" },
          { eng: "Option C", mar: "पर्याय क" },
          { eng: "Option D", mar: "पर्याय ड" }
        ],
        correct: 0,
        explanationEng: "This is a default sample question explanation.",
        explanationMar: "हा इंग्रजी आणि मराठीतील डीफॉल्ट स्पष्टीकरण नमुना आहे."
      }
    ];

    const activeQuestions = chapter === '1' ? buildPaper30(LV) : defaultQuestions;

    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswered = false;
    let skipped = 0;

    /* ---------- TIMER ---------- */
    const timerDisplay = document.getElementById('timerDisplay');
    const startTime = Date.now();
    let timerInterval = null;
    let totalSeconds = 0;

    function formatTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const mm = String(m).padStart(2, '0');
      const ss = String(s).padStart(2, '0');
      return h > 0 ? `${String(h).padStart(2, '0')}:${mm}:${ss}` : `${mm}:${ss}`;
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        totalSeconds = Math.floor((Date.now() - startTime) / 1000);
        timerDisplay.textContent = formatTime(totalSeconds);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      totalSeconds = Math.floor((Date.now() - startTime) / 1000);
      timerDisplay.textContent = formatTime(totalSeconds);
    }
    /* --------------------------- */

    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const questionCounter = document.getElementById('questionCounter');
    const scoreTracker = document.getElementById('scoreTracker');
    const progressBar = document.getElementById('progressBar');
    const questionTextEng = document.getElementById('questionTextEng');
    const questionTextMar = document.getElementById('questionTextMar');
    const optionsContainer = document.getElementById('optionsContainer');
    
    const feedbackBox = document.getElementById('feedbackBox');
    const feedbackIcon = document.getElementById('feedbackIcon');
    const feedbackTitle = document.getElementById('feedbackTitle');
    const feedbackTextEng = document.getElementById('feedbackTextEng');
    const feedbackTextMar = document.getElementById('feedbackTextMar');
    const nextBtn = document.getElementById('nextBtn');
    const skipBtn = document.getElementById('skipBtn');

    function renderQuestion() {
      isAnswered = false;
      feedbackBox.classList.add('hidden');
      nextBtn.style.display = 'none';
      skipBtn.style.display = 'flex';

      const q = activeQuestions[currentQuestionIndex];
      questionCounter.textContent = `Question ${currentQuestionIndex + 1}/${activeQuestions.length}`;
      scoreTracker.textContent = `Score: ${score}`;
      progressBar.style.width = `${((currentQuestionIndex + 1) / activeQuestions.length) * 100}%`;

      questionTextEng.textContent = q.questionEng;
      questionTextMar.textContent = q.questionMar;
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-2.5 md:p-3 rounded-xl border-2 border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/40 transition flex items-center justify-between group bg-white";
        btn.innerHTML = `
          <div class="flex items-start gap-2.5">
            <span class="w-6 h-6 rounded-lg bg-slate-100 group-hover:bg-emerald-600 group-hover:text-white text-slate-700 flex items-center justify-center font-bold text-xs transition shrink-0 mt-0.5">
              ${String.fromCharCode(65 + idx)}
            </span>
            <div>
              <p class="text-xs md:text-sm font-bold text-slate-800">${opt.eng}</p>
              <p class="text-[11px] font-semibold text-emerald-800 marathi-text mt-0.5">${opt.mar}</p>
            </div>
          </div>
        `;
        btn.onclick = () => selectOption(idx, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, selectedBtn) {
      if (isAnswered) return;
      isAnswered = true;
      skipBtn.style.display = 'none';

      const q = activeQuestions[currentQuestionIndex];
      const isCorrect = selectedIndex === q.correct;

      if (isCorrect) score++;
      scoreTracker.textContent = `Score: ${score}`;

      const optionButtons = optionsContainer.children;
      Array.from(optionButtons).forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.correct) {
          btn.className = "w-full text-left p-2.5 md:p-3 rounded-xl border-2 border-emerald-500 bg-emerald-50 font-bold text-emerald-950 flex items-center justify-between";
        } else if (idx === selectedIndex && !isCorrect) {
          btn.className = "w-full text-left p-2.5 md:p-3 rounded-xl border-2 border-rose-500 bg-rose-50 font-bold text-rose-950 flex items-center justify-between";
        } else {
          btn.classList.add('opacity-40');
        }
      });

      feedbackBox.classList.remove('hidden');
      if (isCorrect) {
        feedbackBox.className = "p-3 rounded-xl mb-4 text-xs border bg-emerald-50 border-emerald-200";
        feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i>`;
        feedbackTitle.textContent = "बरोबर उत्तर! (Correct Answer)";
        feedbackTitle.className = "font-bold text-emerald-800 text-xs mb-0.5";
      } else {
        feedbackBox.className = "p-3 rounded-xl mb-4 text-xs border bg-rose-50 border-rose-200";
        feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-600"></i>`;
        feedbackTitle.textContent = "चुकीचे उत्तर! (Incorrect Answer)";
        feedbackTitle.className = "font-bold text-rose-800 text-xs mb-0.5";
      }

      feedbackTextEng.textContent = q.explanationEng;
      feedbackTextMar.textContent = "स्पष्टीकरण: " + q.explanationMar;

      nextBtn.style.display = 'flex';
      nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function skipQuestion() {
      if (isAnswered) return;
      skipped++;
      nextQuestion();
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < activeQuestions.length) {
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showResults();
      }
    }

    function showResults() {
      stopTimer();
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');

      const percentage = Math.round((score / activeQuestions.length) * 100);
      document.getElementById('finalScore').textContent = `${score}/${activeQuestions.length}`;
      document.getElementById('finalPercentage').textContent = `${percentage}%`;
      document.getElementById('finalTime').textContent = formatTime(totalSeconds);
      document.getElementById('finalSkipped').textContent = skipped;

      const perfMsg = document.getElementById('performanceMessage');
      if (percentage === 100) {
        perfMsg.textContent = "उत्तुंग यश! तुम्ही सर्व प्रश्नांची उत्तरे बरोबर दिली आहेत.";
      } else if (percentage >= 50) {
        perfMsg.textContent = "छान प्रयत्न! तुमचा अभ्यास चांगला आहे.";
      } else {
        perfMsg.textContent = "पुन्हा एकदा धडा वाचा आणि सराव करा!";
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    startTimer();
    renderQuestion();
  </script>
