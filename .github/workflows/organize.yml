<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>चॅप्टर्सची यादी - All Exam</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        
        .main-header { 
            background: linear-gradient(135deg, #007bff, #0056b3); 
            color: white; 
            padding: 25px; 
            border-radius: 12px; 
            text-align: center; 
            margin-bottom: 30px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        .main-header h1 { margin: 0 0 8px 0; font-size: 2rem; }
        .main-header p { margin: 0; font-size: 1.1rem; opacity: 0.9; }

        .section-title { color: #333; margin-top: 25px; border-bottom: 3px solid #007bff; padding-bottom: 6px; font-size: 1.4rem; }
        
        .chapters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 25px; }
        
        .chapter-card { 
            background: #ffffff; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.06); 
            transition: all 0.3s ease; 
            border-top: 5px solid #007bff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .chapter-card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 12px 25px rgba(0,123,255,0.15); 
        }
        .chapter-card h4 { margin: 0 0 10px 0; color: #222; font-size: 1.2rem; }
        .chapter-card p { margin: 0 0 20px 0; color: #666; font-size: 0.95rem; line-height: 1.4; }
        
        .btn-green { 
            background: linear-gradient(135deg, #28a745, #218838); 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.95rem; 
            font-weight: bold; 
            text-decoration: none; 
            text-align: center;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(40,167,69,0.2);
        }
        .btn-green:hover { background: linear-gradient(135deg, #218838, #1e7e34); }

        #test-section {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .test-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            margin-top: 20px; 
        }
        
        .test-card { 
            background: #ffffff; 
            border-radius: 12px; 
            padding: 25px; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.08); 
            text-align: center;
            transition: transform 0.3s ease; 
        }
        .test-card:hover { transform: translateY(-6px); }

        .card-1 { border-top: 6px solid #ffc107; background: linear-gradient(to bottom, #fffdf5, #ffffff); }
        .card-2 { border-top: 6px solid #17a2b8; background: linear-gradient(to bottom, #f0f8ff, #ffffff); }
        .card-3 { border-top: 6px solid #28a745; background: linear-gradient(to bottom, #f2f9f4, #ffffff); }

        .test-card h3 { margin: 0 0 10px 0; color: #333; font-size: 1.3rem; }
        .test-card p { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        
        .btn-start { 
            display: inline-block;
            color: white; 
            padding: 9px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.95rem; 
            font-weight: bold; 
            text-decoration: none; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .btn-1 { background: #ffc107; color: #333; }
        .btn-2 { background: #17a2b8; }
        .btn-3 { background: #28a745; }

        .back-btn { 
            background: #6c757d; 
            color: white; 
            padding: 9px 18px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            margin-bottom: 20px; 
            font-size: 0.95rem; 
            font-weight: bold; 
            transition: background 0.2s;
        }
        .back-btn:hover { background: #5a6268; }

        footer { text-align: center; margin-top: 50px; padding: 20px; color: #777; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

    <button class="back-btn" onclick="history.back()">← मागील पानावर जा</button>

    <div class="main-header">
        <h1 id="page-title">चॅप्टर्स अभ्यास मंच</h1>
        <p id="page-subtitle">निवडलेला अभ्यासक्रम आणि विषय</p>
    </div>

    <div id="chapters-view">
        <h2 class="section-title">📖 या विषयातील चॅप्टर्स (Chapters List)</h2>
        <div class="chapters-grid" id="chapters-container"></div>
    </div>

    <div id="test-section">
        <h2 class="section-title" id="selected-chapter-heading">चॅप्टरचे नाव</h2>
        <p style="text-align: center; color: #555; margin-bottom: 20px;">खालीलपैकी कोणतीही एक टेस्ट निवडून सराव सुरू करा (प्रत्येकी १०० गुण)</p>
        
        <div class="test-grid">
            <div class="test-card card-1">
                <h3>टेस्ट १ (Test 1)</h3>
                <p>या टेस्टमध्ये १०० गुणांचे महत्त्वाचे प्रश्न आहेत.</p>
                <a href="#" id="link-test1" class="btn-start btn-1">टेस्ट १ सुरू करा</a>
            </div>
            <div class="test-card card-2">
                <h3>टेस्ट २ (Test 2)</h3>
                <p>सरावासाठी नवीन प्रश्नसंच (१०० गुण).</p>
                <a href="#" id="link-test2" class="btn-start btn-2">टेस्ट २ सुरू करा</a>
            </div>
            <div class="test-card card-3">
                <h3>टेस्ट ३ (Test 3)</h3>
                <p>परीक्षाभिमुख अंतिम सराव प्रश्नपत्रिका (१०० गुण).</p>
                <a href="#" id="link-test3" class="btn-start btn-3">टेस्ट ३ सुरू करा</a>
            </div>
        </div>
        <br>
        <button class="back-btn" onclick="goBackToChapters()">← सर्व चॅप्टर्सकडे परत जा</button>
    </div>

    <footer><p>&copy; 2026 all-exam.in | सर्व हक्क सुरक्षित.</p></footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const board = urlParams.get('board') || 'CBSE Board';
        const classNum = urlParams.get('class') || '6';
        const subject = urlParams.get('subject') || 'विषय';

        document.getElementById('page-title').innerText = subject;
        document.getElementById('page-subtitle').innerText = board + ' > वर्ग ' + classNum;

        let container = document.getElementById('chapters-container');
        
        const syllabusData = {
            "Mathematics": [
                { title: "प्रकरण १: Knowing Our Numbers", desc: "संख्यांची ओळख, तुलना आणि स्थानमूल्य." },
                { title: "प्रकरण २: Whole Numbers", desc: "पूर्ण संख्यांचे गुणधर्म आणि संख्या रेषा." },
                { title: "प्रकरण ३: Playing with Numbers", desc: "अवयव, मल्टिपल्स, लसावि आणि मसावि." },
                { title: "प्रकरण ४: Basic Geometrical Ideas", desc: "बिंदू, रेषा, किरण, कोण आणि त्रिकोण." },
                { title: "प्रकरण ५: Understanding Elementary Shapes", desc: "विविध आकार, बाजू आणि कोनांचे मोजमाप." },
                { title: "प्रकरण ६: Integers", desc: "पूर्णांक संख्या आणि त्यांची बेरीज-वजाबाकी." }
            ],
            "Science": [
                { title: "प्रकरण १: The Wonderful World of Science", desc: "विज्ञान आणि आपल्या सभोवतालचे कुतूहल." },
                { title: "प्रकरण २: Diversity in the Living World", desc: "सजीव सृष्टीतील विविधता आणि वनस्पती-प्राण्यांचे वर्गीकरण." },
                { title: "प्रकरण ३: Mindful Eating: A Path to Healthy Body", desc: "अन्नाचे घटक, समतोल आहार आणि आरोग्य." },
                { title: "प्रकरण ४: Exploring Magnets", desc: "चुंबक, त्याचे गुणधर्म आणि उपयोग." },
                { title: "प्रकरण ५: Measurement of Length and Motion", desc: "मोजमापाची मानके आणि गतीचे प्रकार." },
                { title: "प्रकरण ६: Materials Around Us", desc: "पदार्थांचे गुणधर्म आणि त्यांचे वर्गीकरण." }
            ],
            "Social Science": [
                { title: "प्रकरण १: Locating Places on the Earth", desc: "अक्षांश, रेखांश आणि पृथ्वीवरील ठिकाणे शोधणे." },
                { title: "प्रकरण २: Oceans and Continents", desc: "पृथ्वीवरील प्रमुख महासागर आणि सात खंड." },
                { title: "प्रकरण ३: Landforms and Life", desc: "भूप्रदेशाचे प्रकार आणि मानवी जीवन." },
                { title: "प्रकरण ४: What, Where, How and When?", desc: "इतिहास म्हणजे काय? भूतकाळ कसा शोधायचा?" },
                { title: "प्रकरण ५: From Hunting-Gathering to Growing Food", desc: "आदिमानवाचा शिकारीपासून शेतकरी होण्यापर्यंतचा प्रवास." }
            ],
            "English": [
                { title: "Unit 1 - Chapter 1: A Bottle of Dew", desc: "A timeless narrative and folktale offering wisdom." },
                { title: "Unit 1 - Chapter 2: The Raven and the Fox", desc: "An engaging fable focusing on cleverness and wisdom." },
                { title: "Unit 1 - Chapter 3: Rama to the Rescue", desc: "A graphic story from Indian epics and culture." },
                { title: "Unit 2 - Chapter 4: The Unlikely Best Friends", desc: "A heart-touching story highlighting empathy and true friendship." },
                { title: "Unit 2 - Chapter 5: A Friend's Prayer", desc: "A meaningful poetic piece about friendship and values." },
                { title: "Unit 2 - Chapter 6: The Chair", desc: "A touching story focusing on human values and perspectives." }
            ],
            "Hindi": [
                { title: "पाठ १: वह चिड़िया जो", desc: "केदारनाथ अग्रवाल जी की सुंदर कविता।" },
                { title: "पाठ २: बचपन", desc: "कृष्णा सोबती जी का संस्मरण - लेखिका का बचपन।" },
                { title: "पाठ ३: नादान दोस्त", desc: "प्रेमचंद जी की कहानी - नादानी में चिड़िया के अंडों की देखभाल।" },
                { title: "पाठ ४: चाँद से थोड़ी सी गप्पें", desc: "एक छोटी बच्ची की चाँद के साथ प्यारी बातचीत।" },
                { title: "पाठ ५: अक्षर की कहानी", desc: "अक्षरों की खोज और विकास का इतिहास।" }
            ],
            "Information Technology": [
                { title: "Chapter 1: Computer Fundamentals", desc: "Introduction to Computer Hardware, Software, and basic operations." },
                { title: "Chapter 2: Operating System Basics", desc: "Managing files, folders, and windows desktop settings effectively." },
                { title: "Chapter 3: MS Word Basics", desc: "Creating documents, formatting text, inserting images, and editing." }
            ],
            "Sanskrit": [
                { title: "पाठः १: शब्दपरिचयः प्रथमः", desc: "अकारान्त-पुंलिंगशब्दानां परिचयः।" },
                { title: "पाठः २: शब्दपरिचयः द्वितीयः", desc: "आकारान्त-स्त्रीलिंगशब्दानां परिचयः।" },
                { title: "पाठः ३: शब्दपरिचयः तृतीयः", desc: "नपुंसकलिंगशब्दानां परिचयः।" }
            ]
        };

        let chaptersList = syllabusData[subject] || [
            { title: "प्रकरण १: मूलभूत संकल्पना", desc: "या विषयातील प्राथमिक आणि महत्त्वाची माहिती." },
            { title: "प्रकरण २: सराव व अभ्यास", desc: "परीक्षाभिमुख महत्त्वाचे प्रश्न व उत्तरे." }
        ];

        chaptersList.forEach((chap, index) => {
            container.innerHTML += `
                <div class="chapter-card">
                    <div>
                        <h4>${chap.title}</h4>
                        <p>${chap.desc}</p>
                    </div>
                    <button class="btn-green" onclick="showTests('${chap.title}', ${index + 1})">सराव सुरू करा</button>
                </div>
            `;
        });

        function showTests(chapterTitle, chapterIndex) {
            document.getElementById('chapters-view').style.display = 'none';
            document.getElementById('test-section').style.display = 'block';
            document.getElementById('selected-chapter-heading').innerText = '📌 ' + chapterTitle;

            let baseQuizUrl = `quiz.html?board=${encodeURIComponent(board)}&class=${classNum}&subject=${encodeURIComponent(subject)}&chapter=${chapterIndex}`;
            
            document.getElementById('link-test1').href = baseQuizUrl + '&test=1';
            document.getElementById('link-test2').href = baseQuizUrl + '&test=2';
            document.getElementById('link-test3').href = baseQuizUrl + '&test=3';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBackToChapters() {
            document.getElementById('test-section').style.display = 'none';
            document.getElementById('chapters-view').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
