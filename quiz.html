<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>टेस्ट - A Bottle of Dew</title>
<style>
 body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;padding:16px;color:#222}
 .wrap{max-width:760px;margin:auto}
 .head{background:linear-gradient(135deg,#007bff,#0056b3);color:#fff;border-radius:12px;padding:16px;text-align:center}
 .head h2{margin:0 0 4px}
 .bar{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin:14px 0;font-weight:bold}
 .pill{background:#fff;border-radius:8px;padding:8px 12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
 .ok{color:#1e8e3e}.bad{color:#d93025}
 .card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
 .tag{display:inline-block;background:#e8f0fe;color:#1a56b0;border-radius:6px;padding:2px 8px;font-size:13px;margin-bottom:8px}
 .q{font-size:19px;font-weight:bold;margin:6px 0 14px}
 .opt{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;font-size:16px;background:#f8f9fa;color:#222;border:2px solid #dadce0;border-radius:8px;cursor:pointer}
 .opt:hover:enabled{background:#eef3fd}
 .opt.right{background:#e6f4ea;border-color:#1e8e3e}
 .opt.wrong{background:#fce8e6;border-color:#d93025}
 .exp{display:none;margin-top:12px;padding:12px;border-radius:8px;background:#fff8e1;border-left:4px solid #f9ab00;line-height:1.5}
 .next{display:none;margin-top:14px;padding:10px 20px;font-size:16px;background:#007bff;color:#fff;border:none;border-radius:8px;cursor:pointer}
 .back{display:inline-block;margin-bottom:12px;padding:8px 14px;background:#6c757d;color:#fff;border-radius:8px;text-decoration:none}
 .res{text-align:center}.res h1{font-size:44px;margin:8px}
 .mr{color:#555;font-size:.9em;margin-top:2px}.opt .mr{font-size:.85em}body.nomr .mr{display:none}
</style>
</head>
<body>
<div class="wrap">
 <a class="back" href="javascript:history.back()">← मागे जा</a>
 <div class="head"><h2 id="title">टेस्ट</h2><div>English · CBSE Board &gt; वर्ग 6 · Chapter 1: A Bottle of Dew</div></div>
 <div class="bar">
  <div class="pill" id="prog">प्रश्न 0/0</div>
  <div class="pill ok" id="cor">बरोबर: 0</div>
  <div class="pill bad" id="wro">चूक: 0</div>
  <label class="pill"><input type="checkbox" checked onchange="document.body.classList.toggle('nomr',!this.checked)"> मराठी अर्थ</label>
 </div>
 <div class="card" id="box"></div>
</div>

<script>
</script>
<script src="questions.js"></script>
<script>

const id = new URLSearchParams(location.search).get('test') || '1';
const T = TESTS[id] || TESTS[1], Q = T.qs;
let i = 0, c = 0, w = 0, done = false;
const $ = x => document.getElementById(x), box = $('box');
$('title').textContent = T.name;

function stats(){ $('prog').textContent = 'प्रश्न ' + Math.min(i+1,Q.length) + '/' + Q.length; $('cor').textContent = 'बरोबर: ' + c; $('wro').textContent = 'चूक: ' + w; }

function show(){
  if(!Q.length){ box.innerHTML = '<p style="text-align:center">या टेस्टचे प्रश्न लवकरच येतील.</p>'; return; }
  if(i >= Q.length) return result();
  done = false; stats(); box.innerHTML = '';
  const q = Q[i];
  const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = q.t;
  const h = document.createElement('div'); h.className = 'q'; h.textContent = (i+1) + '. ' + q.q;
  box.append(tag, h);
  if(q.qm){const m=document.createElement('div');m.className='mr';m.style.marginBottom='12px';m.textContent=q.qm;box.append(m);}
  q.o.forEach((txt, k) => {
    const b = document.createElement('button'); b.className = 'opt';
    b.textContent = String.fromCharCode(65+k) + ') ' + txt;
    if(q.om){const s=document.createElement('div');s.className='mr';s.textContent=q.om[k];b.append(s);}
    b.onclick = () => pick(k); box.append(b);
  });
  const ex = document.createElement('div'); ex.className = 'exp'; ex.id = 'exp';
  const nx = document.createElement('button'); nx.className = 'next'; nx.id = 'nx';
  nx.textContent = i === Q.length-1 ? 'निकाल पहा' : 'पुढचा प्रश्न →';
  nx.onclick = () => { i++; show(); };
  box.append(ex, nx);
}

function pick(k){
  if(done) return; done = true;
  const q = Q[i], btns = box.querySelectorAll('.opt');
  btns.forEach((b, n) => { b.disabled = true; if(n === q.a) b.classList.add('right'); });
  const ok = k === q.a;
  if(ok) c++; else { w++; btns[k].classList.add('wrong'); }
  const ex = $('exp');
  ex.textContent = (ok ? '✅ Correct! (बरोबर) ' : '❌ Wrong (चूक). Correct answer: ' + String.fromCharCode(65+q.a) + ') ' + q.o[q.a] + (q.om ? ' (' + q.om[q.a] + ')' : '') + '. ') + q.e;
  ex.style.display = 'block'; $('nx').style.display = 'inline-block';
  stats(); i < Q.length && ($('prog').textContent = 'प्रश्न ' + (i+1) + '/' + Q.length);
}

function result(){
  const marks = Math.round(c * 100 / Q.length);
  box.innerHTML = '<div class="res"><h3>टेस्ट पूर्ण!</h3><h1>' + marks + ' / 100</h1>' +
   '<p class="ok">बरोबर: ' + c + '</p><p class="bad">चूक: ' + w + '</p>' +
   '<p>टक्केवारी: ' + marks + '%</p><button class="next" style="display:inline-block" onclick="location.reload()">पुन्हा सोडवा</button></div>';
  $('prog').textContent = 'पूर्ण';
}
show();
</script>
</body>
</html>
